---
# Docker manipulates netfilter rules. We intentionally do not replace the
# host firewall with a simplistic UFW ruleset. Services should not publish
# ports unless explicitly required. Caddy/HA use host networking where needed.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
