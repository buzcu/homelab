---
- name: Install base packages
  ansible.builtin.apt:
    update_cache: true
    state: present
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - jq
      - htop
      - vim
      - rsync
      - smartmontools
      - unattended-upgrades
      - lm-sensors
      - acl
      - openssl
      # Required by scripts/: YAML parsing for render/deploy/check-versions,
      # consistent SQLite backups, and off-host replication.
      - python3
      - python3-yaml
      - sqlite3
      - restic

- name: Set timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Create homelab service user
  ansible.builtin.user:
    name: "{{ homelab_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Create repository directory
  ansible.builtin.file:
    path: /opt/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable unattended security upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

# harden_ssh was previously declared but never used. It is opt-in for the
# reason docs/SECURITY.md gives: confirm a key-based session works in a second
# terminal first, because this locks out password logins for good.
- name: Harden SSH authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/base). Requires harden_ssh: true.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  when: harden_ssh | bool
  notify: Reload sshd

- name: Verify the SSH configuration is valid
  ansible.builtin.command: sshd -t
  changed_when: false
  when: harden_ssh | bool
