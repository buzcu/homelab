---
- name: Install base packages
  ansible.builtin.apt:
    update_cache: true
    state: present
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - jq
      - htop
      - vim
      - rsync
      - smartmontools
      - unattended-upgrades
      - lm-sensors
      - acl
      - openssl

- name: Set timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Create homelab service user
  ansible.builtin.user:
    name: "{{ homelab_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Create repository directory
  ansible.builtin.file:
    path: /opt/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable unattended security upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started
