# The Caddyfile is generated by scripts/render from config/domains.yml.
# Never edit /srv/data/caddy/Caddyfile directly; the next render overwrites it.
services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    network_mode: host
    volumes:
      - /srv/data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/data/caddy/data:/data
      - /srv/data/caddy/config:/config
