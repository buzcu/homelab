# Installed to /srv/data/mosquitto/config/mosquitto.conf by scripts/render.
# Edit here, not there.
listener 1883 0.0.0.0
allow_anonymous false
# Generated by scripts/render from MOSQUITTO_USERNAME / MOSQUITTO_PASSWORD.
# Without it, allow_anonymous false rejects every client.
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
