# The config and password file are generated by scripts/render from
# services/mosquitto/config/mosquitto.conf and config/secrets.env.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    restart: unless-stopped
    # Published on loopback for Home Assistant, which runs on the host
    # network. Container-to-container clients use the homelab network below.
    ports:
      - "127.0.0.1:1883:1883"
    networks:
      - homelab
    volumes:
      - /srv/data/mosquitto/config:/mosquitto/config:ro
      - /srv/data/mosquitto/data:/mosquitto/data
      - /srv/data/mosquitto/log:/mosquitto/log

networks:
  homelab:
    external: true
