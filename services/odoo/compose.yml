services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${ODOO_DB_PASSWORD}"
    volumes:
      - /srv/data/odoo/postgres:/var/lib/postgresql/data

  web:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${ODOO_DB_PASSWORD}"
    volumes:
      - /srv/data/odoo/filestore:/var/lib/odoo
