services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in config/secrets.env}"
    volumes:
      - /srv/data/odoo/postgres:/var/lib/postgresql/data

  web:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${ODOO_DB_PASSWORD}"
    volumes:
      - /srv/data/odoo/filestore:/var/lib/odoo
