services:
  lldap:
    image: lldap/lldap:2025-01-25
    container_name: lldap
    restart: unless-stopped
    # 17170 is the web UI (proxied by Caddy). 3890 is LDAP: published on
    # loopback for host-side clients, and reachable as ldap://lldap:3890 from
    # containers on the homelab network.
    ports:
      - "127.0.0.1:17170:17170"
      - "127.0.0.1:3890:3890"
    networks:
      - homelab
    environment:
      TZ: "${TZ:-Europe/Amsterdam}"
      UID: "1000"
      GID: "1000"
      LLDAP_JWT_SECRET: "${LLDAP_JWT_SECRET:?set LLDAP_JWT_SECRET in config/secrets.env}"
      LLDAP_LDAP_USER_PASS: "${LLDAP_LDAP_USER_PASS:?set LLDAP_LDAP_USER_PASS in config/secrets.env}"
      LLDAP_LDAP_BASE_DN: "${LLDAP_LDAP_BASE_DN:-dc=home,dc=arpa}"
    volumes:
      - /srv/data/lldap:/data

networks:
  homelab:
    external: true
