services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:12.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
      # 127.0.0.1 makes git-over-SSH unreachable from the tailnet. Set
      # FORGEJO_SSH_BIND to this host's Tailscale IP to allow it.
      - "${FORGEJO_SSH_BIND:-127.0.0.1}:2222:22"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    volumes:
      - /srv/data/forgejo:/data
