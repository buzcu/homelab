services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.15
    restart: unless-stopped
    ports:
      - "127.0.0.1:8989:8989"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Europe/Amsterdam}"
    volumes:
      - /srv/data/sonarr:/config
      # Same single mount as qBittorrent, so hardlinks work. Scoped to the
      # media library rather than all of /srv/data.
      - /srv/data/library:/data
