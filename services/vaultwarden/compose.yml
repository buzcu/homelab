services:
  vaultwarden:
    image: vaultwarden/server:1.34.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      # Must be the full external URL. Bitwarden clients, WebAuthn and
      # invitation links all break silently if this is wrong or empty.
      DOMAIN: "${VAULTWARDEN_URL:?set VAULTWARDEN_URL or vaultwarden domain}"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
    volumes:
      - /srv/data/vaultwarden:/data
