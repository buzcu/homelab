services:
  vaultwarden:
    image: vaultwarden/server:1.34.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      DOMAIN: "${VAULTWARDEN_DOMAIN}"
    volumes:
      - /srv/data/vaultwarden:/data
