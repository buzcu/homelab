services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Amsterdam
      WEBUI_PORT: "8080"
    volumes:
      - /srv/data/qbittorrent:/config
      - /srv/data/downloads:/data/downloads
