services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.0.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:9696:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Europe/Amsterdam}"
    volumes:
      # Prowlarr manages indexers only; it never touches media or downloads.
      - /srv/data/prowlarr:/config
