# Frontend is on 8087, not 8080: Nextcloud AIO owns 8080 and both are in the
# "core" deployment group.
# /srv/data/zigbee2mqtt/configuration.yaml is seeded once by scripts/render
# and points at mqtt://mosquitto:1883 over the shared homelab network.
services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8080"
    networks:
      - homelab
    environment:
      TZ: "${TZ:-Europe/Amsterdam}"
    volumes:
      - /srv/data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - "${ZIGBEE_DEVICE:?set ZIGBEE_DEVICE in config/secrets.env}:/dev/ttyUSB0"

networks:
  homelab:
    external: true
