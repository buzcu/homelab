name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v2.0.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:2283:2283"
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: "${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD in config/secrets.env}"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    volumes:
      - "${IMMICH_UPLOAD_LOCATION:-/srv/data/immich/library}:/data"
      - /etc/localtime:/etc/localtime:ro

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.0.0
    restart: unless-stopped
    volumes:
      - model-cache:/cache

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${IMMICH_DB_PASSWORD}"
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    volumes:
      # Must stay on local Unix-compatible storage, never a network share.
      - "${IMMICH_DB_DATA_LOCATION:-/srv/data/immich/postgres}:/var/lib/postgresql/data"
    shm_size: 128mb

volumes:
  model-cache:
