services:
  radarr:
    image: lscr.io/linuxserver/radarr:5.27.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Europe/Amsterdam}"
    volumes:
      - /srv/data/radarr:/config
      # Same single mount as qBittorrent, so hardlinks work. Scoped to the
      # media library rather than all of /srv/data.
      - /srv/data/library:/data
