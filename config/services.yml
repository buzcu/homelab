# true = enabled for deployment. Set false to keep the Compose definition in
# the repository but out of every deploy.
#
# This file is enforced, not documentation: scripts/deploy skips a disabled
# service (--force overrides), scripts/update-images does not pull it, and
# scripts/backup does not report its missing container as a failure.
#
# A service that is not listed here defaults to enabled, so adding a new
# Compose directory is never silently skipped.
core:
  caddy: true
  nextcloud-aio: true
  vaultwarden: true
  homeassistant: true
  mosquitto: true
  zigbee2mqtt: false
  lldap: true
  adguard: false
  uptime-kuma: true

documents:
  paperless: true
  stirling-pdf: true

photos:
  immich: true

media:
  jellyfin: false
  qbittorrent: false
  prowlarr: false
  radarr: false
  sonarr: false

books:
  calibre: false

business:
  odoo: false
  forgejo: false
