# Authoritative image pins.
#
# This file is the single source of truth for every image tag in services/.
# `scripts/check-versions` (also run by `make validate` and CI) fails if a
# Compose file disagrees with an entry here, so the two cannot drift.
#
# Keys are "<service directory>/<compose service name>".
#
# To upgrade: read the upstream release notes, back up the affected
# application/database, change the tag here AND in the Compose file, run
# `make validate`, then deploy that one service.

images:
  # --- core ---------------------------------------------------------------
  caddy/caddy: caddy:2.10.2

  # Nextcloud AIO is the documented exception to version pinning: the
  # mastercontainer self-updates and upstream only supports :latest. Its
  # component containers are pinned by the mastercontainer, not by us.
  nextcloud-aio/nextcloud-aio-mastercontainer: nextcloud/all-in-one:latest

  vaultwarden/vaultwarden: vaultwarden/server:1.34.3
  homeassistant/homeassistant: ghcr.io/home-assistant/home-assistant:2026.8.3
  mosquitto/mosquitto: eclipse-mosquitto:2.0.22
  zigbee2mqtt/zigbee2mqtt: koenkk/zigbee2mqtt:2.6.0
  lldap/lldap: lldap/lldap:2025-01-25
  adguard/adguardhome: adguard/adguardhome:v0.107.66
  uptime-kuma/uptime-kuma: louislam/uptime-kuma:2.0.0

  # --- documents ----------------------------------------------------------
  paperless/webserver: ghcr.io/paperless-ngx/paperless-ngx:2.20.0
  paperless/db: postgres:17-alpine
  paperless/broker: redis:7.4-alpine
  stirling-pdf/stirling-pdf: frooodle/s-pdf:1.3.2

  # --- photos -------------------------------------------------------------
  immich/immich-server: ghcr.io/immich-app/immich-server:v2.0.0
  immich/immich-machine-learning: ghcr.io/immich-app/immich-machine-learning:v2.0.0
  immich/database: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  immich/redis: docker.io/valkey/valkey:8

  # --- media --------------------------------------------------------------
  jellyfin/jellyfin: jellyfin/jellyfin:10.10.7
  qbittorrent/qbittorrent: lscr.io/linuxserver/qbittorrent:5.1.2
  prowlarr/prowlarr: lscr.io/linuxserver/prowlarr:2.0.5
  radarr/radarr: lscr.io/linuxserver/radarr:5.27.5
  sonarr/sonarr: lscr.io/linuxserver/sonarr:4.0.15

  # --- books --------------------------------------------------------------
  calibre/calibre-web: linuxserver/calibre-web:0.6.25

  # --- business -----------------------------------------------------------
  odoo/web: odoo:19.0
  odoo/db: postgres:15-alpine
  forgejo/forgejo: codeberg.org/forgejo/forgejo:12.0
